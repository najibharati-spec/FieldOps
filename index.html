<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<style>
:root{
  --sand: #FFF6DE;
  --sand-deep: #FDE29E;
  --sky: #00A082;
  --sky-deep: #007A63;
  --sky-ink: #00614E;
  --mustard: #E8A317;
  --mustard-deep: #B9800E;
  --ink: #1F1B0E;
  --ink-soft: #6B5D3D;
  --paper: #FFFFFF;
  --line: rgba(80,64,20,0.26);
  --green: #047857;
  --red: #DC2626;
  --radius: 14px;
  --font-display: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{ background: var(--sand); }
body{
  font-family: var(--font-display);
  background:
    radial-gradient(circle at 12% 0%, rgba(0,160,130,0.07), transparent 42%),
    radial-gradient(circle at 88% 18%, rgba(232,163,23,0.06), transparent 40%),
    var(--sand);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button{font-family: inherit; cursor:pointer; border:none;}
input, select{font-family: inherit;}
::selection{background: var(--mustard); color: #fff;}

/* ============ LOGIN SCREEN ============ */
:root{
  --login-navy: #FFF6DE;
  --login-navy-2: #FDE29E;
  --login-amber: #FFC244;
  --login-cream: #FFFFFF;
}
#loginScreen{ min-height: 100vh; }
.login-split{ min-height: 100vh; display:flex; }
.login-hero-panel{
  flex: 1 1 46%; min-width: 340px;
  background:
    radial-gradient(circle at 20% 10%, rgba(0,160,130,0.16), transparent 40%),
    linear-gradient(160deg, var(--login-navy), var(--login-navy-2));
  color: #2B2440;
  display:flex; flex-direction:column; justify-content:space-between;
  padding: 40px 44px;
  position: relative; overflow:hidden;
}
.hero-brand{ display:flex; align-items:center; gap:10px; }
.hero-brand .login-mark{ width:36px; height:36px; box-shadow:none; background: var(--login-amber); }
.login-mark{
  width: 36px; height: 36px; border-radius: 10px;
  display:flex; align-items:center; justify-content:center;
}
.login-mark svg{ width:20px; height:20px; }
.hero-brand span{ font-size:16px; font-weight:800; letter-spacing:-0.01em; color:#2B2440; }
.route-map{ flex:1; display:flex; align-items:center; justify-content:center; padding: 10px 0; }
.route-svg{ width: 100%; max-width: 340px; height: auto; }
.pin-dot-outer{ fill: var(--login-amber); }
.pin-dot-inner{ fill: #fff; }
.pin-label{ fill: rgba(43,36,64,0.82); font-family: var(--font-display); font-size: 12.5px; font-weight: 700; }
.hero-foot{ font-family: var(--font-mono); }
.hero-foot span{ font-size: 22px; font-weight: 700; color: var(--login-amber); display:block; margin-bottom:6px; }
.hero-foot p{ font-size: 12px; color: rgba(43,36,64,0.6); max-width: 280px; }

.login-form-panel{
  flex: 1 1 54%;
  background: var(--login-cream);
  display:flex; align-items:center; justify-content:center;
  padding: 40px 24px;
}
.login-card{ width: 100%; max-width: 440px; }
.login-brand{ margin-bottom: 26px; }
.login-brand h1{ font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--sky-ink); }
.login-brand p{ font-size: 13px; color: var(--ink-soft); margin-top: 4px; font-family: var(--font-mono); }

@media (max-width: 860px){
  .login-split{ flex-direction: column; }
  .login-hero-panel{ min-width: 0; padding: 28px; }
  .route-map, .hero-foot p{ display:none; }
}
.profile-grid{
  display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  margin-bottom: 20px; max-height: 320px; overflow-y: auto; padding-right: 2px;
}
.profile-btn{
  background: var(--sand-deep);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 10px;
  display:flex; flex-direction:column; align-items:center; gap: 8px;
  transition: all .15s ease;
}
.profile-btn:hover{ border-color: var(--sky); background: var(--paper); transform: translateY(-1px); }
.profile-btn.selected{ border-color: var(--sky); background: var(--paper); box-shadow: 0 0 0 3px rgba(0,160,130,0.16); }
.profile-avatar{
  width: 40px; height: 40px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size: 14px;
}
.profile-avatar svg{ width: 20px; height: 20px; }
.profile-btn span{font-size: 13px; font-weight: 600; color: var(--ink);}
.profile-btn small{font-size: 10px; color: var(--ink-soft); text-transform:uppercase;}

.login-input{
  width:100%; padding: 13px 14px; border-radius: var(--radius);
  border: 1.5px solid var(--line); background: var(--sand-deep);
  font-size: 14px; margin-bottom: 12px; color: var(--ink);
}
.login-input:focus{ outline:none; border-color: var(--sky); background: var(--paper); }
.login-submit{
  width:100%; padding: 14px; border-radius: var(--radius);
  background: var(--mustard); color: #fff; font-weight: 700; font-size: 14px;
}
.login-submit:hover{ background: var(--mustard-deep); }
.login-submit:disabled{ background: var(--line); color: var(--ink-soft); cursor:not-allowed; }
.login-error{ font-size: 12.5px; color: var(--red); text-align:center; margin-top: 10px; min-height: 16px; }

/* ============ PORTAL ============ */
#agentPortal, #nvAgentPortal{
  min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap: 16px; padding: 20px 16px; position: relative; overflow-x:hidden;
  background: var(--sand);
}
.portal-card{
  width:100%; max-width: 460px; background: var(--paper); border-radius: 20px; padding: 28px;
  box-shadow: 0 30px 80px -24px rgba(30,20,60,0.18); border:1px solid var(--line);
}
.portal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 20px; }
.portal-btn{
  width:100%; padding: 18px; border-radius: 14px; background: var(--green); color:#fff;
  font-size: 16px; font-weight: 800; margin-bottom: 6px;
}

/* ============ SHELL / DASHBOARD ============ */
.shell{ display:flex; min-height: 100vh; }
.sidebar{
  width: 220px; flex-shrink:0;
  background: linear-gradient(180deg, #FAF8FE, #F0EAFC);
  border-right: 1.5px solid var(--line);
  display:flex; flex-direction:column;
  padding: 22px 14px;
}
.sidebar-brand{ display:flex; align-items:center; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.sidebar-brand .mark{ width:32px; height:32px; border-radius:9px; background: var(--sky); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
.nav-item{
  display:flex; align-items:center; gap: 10px; width:100%; text-align:left; padding: 9px 10px;
  border-radius: 9px; color: var(--ink-soft); background: transparent; font-size: 13.5px; font-weight: 600;
  margin-bottom: 2px;
}
.nav-item.active{ background: var(--sky); color: #fff; }
.nav-item svg{ width:16px; height:16px; }
.sidebar-footer{ margin-top:auto; padding-top: 14px; border-top: 1px solid var(--line); }
.logout-btn{ width:100%; padding: 8px; border-radius: 8px; background: var(--sand-deep); font-size: 12.5px; font-weight:600; margin-top:6px; }
.main{ flex:1; overflow-x:auto; max-width:100vw; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding: 18px 32px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.85); sticky: top 0; }
.view{ padding: 28px 32px; }
.hidden{ display:none !important; }

/* Dashboard cards */
.stat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card{ background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--sky-ink); border-radius: 18px; padding: 18px; }
.stat-card .label{ font-size: 11.5px; color: var(--ink-soft); font-weight:600; margin-bottom: 8px; text-transform:uppercase;}
.stat-card .value{ font-size: 28px; font-weight: 800; color: var(--sky-ink); font-family: var(--font-mono); }
.section-title{ font-size: 15px; font-weight: 800; margin: 26px 0 14px; color: var(--ink); }
.card{ background: var(--paper); border:1.5px solid var(--line); border-radius: 18px; }
table{ width:100%; border-collapse: collapse; }
th{ text-align:left; font-size: 11px; text-transform:uppercase; color: var(--ink-soft); font-weight:700; padding: 12px 16px; border-bottom: 1px solid var(--line); }
td{ padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.badge{ display:inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge.jour{ background: rgba(5,150,105,0.18); color: #047857; }
.badge.nuit{ background: rgba(232,163,23,0.18); color: #8A6208; }

/* Modals */
.modal-overlay{ position: fixed; inset: 0; background: rgba(30,20,60,0.35); backdrop-filter: blur(4px); display:flex; align-items:center; justify-content:center; z-index: 100; padding: 20px; }
.modal-card{ width: 100%; max-width: 440px; background: var(--paper); border-radius: 16px; padding: 28px; }
.modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 16px; }

/* VUE ZONES (Restée Intacte) */
.nv-zone-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 18px; }
.nv-zone-card{ border-radius: 20px; overflow:hidden; background: var(--paper); border: 1px solid var(--line); }
.nv-zone-head{ padding: 16px 20px; color:#fff; display:flex; align-items:center; justify-content:space-between; }
.nv-member-row{ padding: 14px 20px; border-bottom: 1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.nv-chip{ font-size: 12.5px; font-weight: 700; padding: 6px 13px; border-radius: 20px; }
.nv-chip.shift-jour{ background: rgba(5,150,105,0.18); color: #047857; }
.nv-chip.shift-nuit{ background: rgba(232,163,23,0.18); color: #8A6208; }
.nv-today-hero{ border-radius: 12px; padding: 12px 14px; color:#fff; }
.nv-today-hero-off{ background: var(--sand-deep); color: var(--ink-soft); font-weight: 700; }
.nv-fulllist{ padding: 12px 20px 16px; background: var(--sand-deep); }
.nv-venue-tag{ display:inline-flex; align-items:center; gap:5px; background: var(--paper); border:1px solid var(--line); border-radius: 6px; padding: 3px 7px; margin: 2px; font-size: 11.5px; }

/* ============ THÈME ELECTRIC VIOLET - VUE SEMAINE ============ */
.nv-week-header-bar {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  background: #ffffff; padding: 14px 18px; border-radius: 16px; margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(91, 33, 182, 0.08);
}
.nv-week-title-box { display: flex; align-items: center; gap: 12px; }
.nv-week-title-box .nv-icon-bolt {
  width: 36px; height: 36px; border-radius: 10px; background: #6d28d9; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.nv-week-title-text h2 { font-size: 16px; font-weight: 800; color: #1e1b4b; }
.nv-week-title-text span { font-size: 11px; color: #6b7280; font-family: var(--font-mono); }
.nv-week-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nv-btn-pill {
  padding: 7px 13px; border-radius: 8px; font-size: 12px; font-weight: 700;
  border: 1px solid #e5e7eb; background: #fff; color: #374151; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.nv-btn-pill:hover { background: #f3f4f6; }
.nv-btn-primary-purple { background: #6d28d9; color: #fff; border: none; }
.nv-btn-primary-purple:hover { background: #5b21b6; }
.nv-lock-tag { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; padding: 6px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 700; }
.nv-lock-banner {
  background: #fefce8; border: 1px solid #fef08a; padding: 10px 16px; border-radius: 10px;
  margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: #854d0e; font-weight: 600;
}
.nv-lock-banner button { border: none; background: none; color: #6d28d9; font-weight: 700; font-size: 11.5px; cursor: pointer; text-decoration: underline; }
.nv-week-table-card {
  background: #ffffff; border-radius: 16px; overflow-x: auto;
  box-shadow: 0 4px 18px rgba(91, 33, 182, 0.06); border: 1px solid rgba(109, 40, 217, 0.12);
}
.nv-electric-table { width: 100%; border-collapse: collapse; min-width: 980px; }
.nv-electric-table thead th {
  background: #581c87; color: #ffffff; font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 10px; text-align: center;
}
.nv-electric-table thead th.th-left { text-align: left; padding-left: 16px; }
.nv-electric-table thead th .th-sub { display: block; font-size: 9.5px; opacity: 0.75; font-weight: 600; margin-top: 2px; }
.nv-electric-table tbody tr { border-bottom: 1px solid #f3f4f6; }
.nv-electric-table tbody tr:hover { background: #faf5ff; }
.nv-electric-table td { padding: 8px 6px; text-align: center; font-size: 12px; }
.nv-select-custom {
  width: 100%; padding: 6px 10px; border-radius: 8px; border: 1px solid #e5e7eb;
  background: #ffffff; font-size: 12px; font-weight: 700; color: #1e1b4b; cursor: pointer;
}
.nv-shift-pill-blue {
  background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-family: var(--font-mono);
  font-size: 11px; font-weight: 700; padding: 6px 6px; border-radius: 8px; display: block; cursor: pointer;
}
.nv-shift-pill-blue:hover { background: #dbeafe; border-color: #93c5fd; }
.nv-shift-pill-off {
  background: #f9fafb; color: #9ca3af; border: 1px solid #f3f4f6; font-family: var(--font-mono);
  font-size: 11px; font-weight: 700; padding: 6px 6px; border-radius: 8px; display: block; cursor: pointer;
}
.nv-total-ok { background: #ecfdf5; color: #047857; font-weight: 800; font-size: 11px; padding: 5px 10px; border-radius: 20px; font-family: var(--font-mono); }
.nv-total-warn { background: #fef2f2; color: #dc2626; font-weight: 800; font-size: 11px; padding: 5px 10px; border-radius: 20px; font-family: var(--font-mono); }
.nv-action-del-btn { border: none; background: transparent; color: #9ca3af; font-size: 14px; cursor: pointer; padding: 2px 6px; }
.nv-action-del-btn:hover { color: #dc2626; background: #fee2e2; }
.planning-tabs { display:flex; gap:6px; margin-bottom: 14px; }
.ptab { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; background: var(--sand-deep); color: var(--ink-soft); }
.ptab.active { background: #6d28d9; color: #fff; }
</style>
</head>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-split">

      <div class="hero-brand">

</div>

function getWeekStart(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function getISOWeekIndex(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getNvZoneLabel(z){ return z; }

function buildZoneAssignmentsNv(weekIdx){
  const zones = { "Salé-Rabat": [], "Agdal": [], "Hay Riad": [], "Temara": [], "Technopolis": [] };
  ROTATING_TEAMS_NV.forEach((team, teamIdx) => {
    const zoneIdx = ((teamIdx + weekIdx) % 4 + 4) % 4;
    zones[ROTATING_ZONES_NV[zoneIdx]].push(...team);
  });
  Object.entries(NV_FIXED_ZONE_AGENTS).forEach(([zone, names]) => {
    if(zones[zone]) zones[zone].push(...names);
  });
  Object.entries(NV_OVERRIDES).forEach(([name, ov]) => {
    if(!ov || !ov.zoneOverride || !zones[ov.zoneOverride]) return;
    Object.keys(zones).forEach(z => {
      const idx = zones[z].indexOf(name);
      if(idx >= 0) zones[z].splice(idx, 1);
    });
    zones[ov.zoneOverride].push(name);
  });
  return zones;
}

function resolveNvShiftInfo(override, memberIdx, weekIdx, agentName){
  if(override && override.shiftKey && SHIFTS_NV[override.shiftKey]) return SHIFTS_NV[override.shiftKey];
  const keys = ['S1', 'S2', 'S3'];
  const shiftKey = keys[(memberIdx + weekIdx) % keys.length];
  return SHIFTS_NV[shiftKey];
}

/* ================= RENDERING VUE SEMAINE ================= */
function renderNvWeekGridView(){
  const weekIdx = getISOWeekIndex(currentWeekStartNv);
  const zones = buildZoneAssignmentsNv(weekIdx);
  const container = document.getElementById('nvWeekGrid');
  const ALL_DAY_LABELS_NV = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

  const dayDates = ALL_DAY_LABELS_NV.map((label, idx) => {
    const d = new Date(currentWeekStartNv);
    d.setDate(d.getDate() + idx);
    const dayStr = String(d.getDate()).padStart(2, '0');
    const monthStr = String(d.getMonth() + 1).padStart(2, '0');
    return { label, dateStr: `${dayStr}/${monthStr}` };
  });

  const rows = [];
  Object.keys(HOTSPOTS_NV).forEach(zone => {
    const members = zones[zone] || [];
    members.forEach((name, memberIdx) => {
      const override = NV_OVERRIDES[name] || {};
      if(override.hidden) return;

      const shiftInfo = resolveNvShiftInfo(override, memberIdx, weekIdx, name);
      const offDayIdx = (typeof override.offDayIdx === 'number') ? override.offDayIdx : (memberIdx + weekIdx) % 4;

      let totalHeures = 0;
      ALL_DAY_LABELS_NV.forEach((_, dIdx) => {
        if(dIdx === offDayIdx) return;
        totalHeures += (dIdx >= 4 && dIdx < 6) ? 8 : 7;
      });
      const hoursOk = totalHeures === 44;

      const agentOptions = NV_ALL_AGENTS.map(agentName => 
        `<option value="${agentName}" ${agentName === name ? 'selected' : ''}>${agentName}</option>`
      ).join('');

      const zoneOptions = Object.keys(HOTSPOTS_NV).map(z => 
        `<option value="${z}" ${z === zone ? 'selected' : ''}>${getNvZoneLabel(z)}</option>`
      ).join('');

      const dayCells = ALL_DAY_LABELS_NV.map((_, dIdx) => {
        if(dIdx === offDayIdx){
          return `<td><span class="nv-shift-pill-off" data-cell-edit-shift="${name}" data-cell-edit-day="${dIdx}">OFF</span></td>`;
        }
        const timeLabel = (dIdx >= 4 && dIdx < 6) ? shiftInfo.label8 : shiftInfo.label7;
        return `<td><span class="nv-shift-pill-blue" data-cell-edit-shift="${name}" data-cell-edit-day="${dIdx}">${timeLabel}</span></td>`;
      }).join('');

      rows.push(`
        <tr>
          <td style="padding-left:14px; text-align:left; min-width:160px;">
            <select class="nv-select-custom nv-agent-selector">${agentOptions}</select>
          </td>
          <td style="text-align:left; min-width:150px;">
            <select class="nv-select-custom nv-zone-selector" data-agent-name="${name}">${zoneOptions}</select>
          </td>
          ${dayCells}
          <td><span class="${hoursOk ? 'nv-total-ok' : 'nv-total-warn'}">${totalHeures}h ${hoursOk ? 'OK' : '⚠️'}</span></td>
          <td>
            <div style="display:flex; align-items:center; gap:6px; justify-content:center;">
              <select class="nv-select-custom" style="width:auto; padding:5px 8px; font-size:11px;" data-shift-ligne="${name}">
                <option value="">⚡ Shift Ligne</option>
                <option value="S1">Matin (11:00)</option>
                <option value="S2">Après-midi (16:00)</option>
                <option value="S3">Nuit (19:00)</option>
              </select>
              <button class="nv-action-del-btn" data-del-row="${name}">✕</button>
            </div>
          </td>
        </tr>
      `);
    });
  });

  const theadDayCols = dayDates.map(d => `<th>${d.label.toUpperCase()}<span class="th-sub">${d.dateStr}</span></th>`).join('');
  const endD = new Date(currentWeekStartNv);
  endD.setDate(endD.getDate() + 6);
  const startFormat = `${String(currentWeekStartNv.getDate()).padStart(2,'0')}/${String(currentWeekStartNv.getMonth()+1).padStart(2,'0')}`;
  const endFormat = `${String(endD.getDate()).padStart(2,'0')}/${String(endD.getMonth()+1).padStart(2,'0')}/${endD.getFullYear()}`;

  container.innerHTML = `
    <div class="nv-week-header-bar">
      <div class="nv-week-title-box">
        <div class="nv-icon-bolt">⚡</div>
        <div class="nv-week-title-text">
          <h2>Operational Shift Planning (44H)</h2>
          <span>Thème Electric Violet • Sélecteurs Agents &amp; Zones • Sauvegarde Permanente</span>
        </div>
      </div>
      <div class="nv-week-controls">
        <button class="nv-btn-pill" id="nvBtnPrevWeek">◀ Précédent</button>
        <div class="nv-btn-pill" style="cursor:default; font-weight:800; background:#f9fafb;">Semaine ${weekIdx} (${startFormat} - ${endFormat})</div>
        <span class="nv-lock-tag">${isNvWeekLocked ? '🔒 Verrouillée' : '🔓 Déverrouillée'}</span>
        <button class="nv-btn-pill" id="nvBtnNextWeek">Suivant ▶</button>
        <button class="nv-btn-pill" id="nvBtnToday">Aujourd'hui</button>
        <button class="nv-btn-pill nv-btn-primary-purple" id="nvBtnAddAgent">+ Ajouter Agent</button>
        <button class="nv-btn-pill" id="nvBtnReset">🔄 Réinitialiser</button>
      </div>
    </div>
    <div class="nv-lock-banner">
      <span>🔒 Semaine en cours verrouillée : Cliquez sur (Suivant ▶) pour modifier le planning de la semaine prochaine.</span>
      <button id="nvBtnUnlockToggle">${isNvWeekLocked ? '🔓 Déverrouiller Exceptionnellement' : '🔒 Re-verrouiller'}</button>
    </div>
    <div class="nv-week-table-card">
      <table class="nv-electric-table">
        <thead><tr><th class="th-left">AGENT</th><th class="th-left">ZONE</th>${theadDayCols}<th>TOTAL</th><th>ACTION LIGNE</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </div>
  `;

  document.getElementById('nvBtnPrevWeek').addEventListener('click', () => { currentWeekStartNv.setDate(currentWeekStartNv.getDate() - 7); listenNvOverrides(); });
  document.getElementById('nvBtnNextWeek').addEventListener('click', () => { currentWeekStartNv.setDate(currentWeekStartNv.getDate() + 7); listenNvOverrides(); });
  document.getElementById('nvBtnToday').addEventListener('click', () => { currentWeekStartNv = getWeekStart(new Date()); listenNvOverrides(); });
  document.getElementById('nvBtnUnlockToggle').addEventListener('click', () => { isNvWeekLocked = !isNvWeekLocked; renderNvWeekGridView(); });

  container.querySelectorAll('.nv-zone-selector').forEach(sel => {
    sel.addEventListener('change', () => {
      const agentName = sel.dataset.agentName;
      const updated = { ...NV_OVERRIDES, [agentName]: { ...(NV_OVERRIDES[agentName] || {}), zoneOverride: sel.value } };
      db.collection('planningNV').doc('overrides_W' + weekIdx).set(updated);
    });
  });

  container.querySelectorAll('[data-shift-ligne]').forEach(sel => {
    sel.addEventListener('change', () => {
      if(!sel.value) return;
      const agentName = sel.dataset.shiftLigne;
      const updated = { ...NV_OVERRIDES, [agentName]: { ...(NV_OVERRIDES[agentName] || {}), shiftKey: sel.value } };
      db.collection('planningNV').doc('overrides_W' + weekIdx).set(updated);
    });
  });
}

function listenNvOverrides(){
  const weekIdx = getISOWeekIndex(currentWeekStartNv);
  if(nvOverridesUnsub) nvOverridesUnsub();
  nvOverridesUnsub = db.collection('planningNV').doc('overrides_W' + weekIdx).onSnapshot(doc => {
    NV_OVERRIDES = (doc.exists && doc.data()) || {};
    if(nvPlanningView === 'week') renderNvWeekGridView();
  });
}

/* ================= APP STARTUP ================= */
document.querySelectorAll('.ptab').forEach(btn => {
  btn.addEventListener('click', () => {
    nvPlanningView = btn.dataset.nvView;
    document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('nvWeekGrid').classList.toggle('hidden', nvPlanningView !== 'week');
    document.getElementById('nvZoneGrid').classList.toggle('hidden', nvPlanningView !== 'zones');
    if(nvPlanningView === 'week') renderNvWeekGridView();
  });
});

auth.onAuthStateChanged(user => {
  if(user && user.email){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sidebarUserName').textContent = user.email.split('@')[0];
    listenNvOverrides();
  } else {
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

// Grid profiles setup
const pGrid = document.getElementById('profileGrid');
PROFILES.forEach(p => {
  const b = document.createElement('button');
  b.className = 'profile-btn';
  b.innerHTML = `<div class="profile-avatar" style="background:${p.color}">${p.name[0]}</div><span>${p.name}</span><small>${p.role}</small>`;
  b.onclick = () => {
    selectedProfile = p;
    document.querySelectorAll('.profile-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    document.getElementById('passwordInput').disabled = false;
    document.getElementById('loginBtn').disabled = false;
  };
  pGrid.appendChild(b);
});

document.getElementById('loginBtn').onclick = () => {
  const pass = document.getElementById('passwordInput').value;
  if(selectedProfile && pass){
    auth.signInWithEmailAndPassword(`${selectedProfile.id}@opshq.ma`, pass).catch(e => {
      document.getElementById('loginError').textContent = "Mot de passe incorrect";
    });
  }
};
document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => location.reload());

document.getElementById('heroClock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
document.getElementById('heroDate').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
</script>
