<style>
/* ================= DESIGN SYSTEM ================= */
:root {
  --bg-dark: #090D16;
  --bg-card: #111827;
  --bg-card-hover: #1F2937;
  --bg-input: #0B0F19;
  --border-color: #1F2937;
  
  --primary-cyan: #38BDF8;
  --primary-cyan-glow: rgba(56, 189, 248, 0.15);
  --accent-orange: #F97316;
  --accent-green: #10B981;
  --accent-purple: #A855F7;
  --accent-red: #EF4444;

  --text-main: #F9FAFB;
  --text-muted: #9CA3AF;
  --text-sub: #6B7280;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; border: none; transition: all 0.2s ease; }
input, select { font-family: inherit; outline: none; }

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-sub); }

.hidden { display: none !important; }
</style>
</head>
