<style>
:root{
  /* Glovo Brand Palette */
  --glovo-yellow: #FFC244;
  --glovo-yellow-hover: #F0B433;
  --glovo-yellow-light: #FFF9EB;
  --glovo-green: #00A082;
  --glovo-green-deep: #007A63;
  --glovo-green-light: #E6F6F2;
  --glovo-bg: #F8F9FA;
  --glovo-bg-subtle: #F1F3F5;
  --glovo-card: #FFFFFF;
  --glovo-ink: #1C2321;
  --glovo-ink-soft: #636E72;
  --glovo-line: #E9ECEF;
  
  /* System aliases */
  --sand: var(--glovo-bg);
  --sand-deep: var(--glovo-bg-subtle);
  --sky: var(--glovo-green);
  --sky-deep: var(--glovo-green-deep);
  --sky-ink: #004D3F;
  --mustard: var(--glovo-yellow);
  --mustard-deep: var(--glovo-yellow-hover);
  --ink: var(--glovo-ink);
  --ink-soft: var(--glovo-ink-soft);
  --paper: var(--glovo-card);
  --line: var(--glovo-line);
  --green: #00A082;
  --red: #EB5757;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 16px 36px rgba(0, 160, 130, 0.12);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ background: var(--glovo-bg); }
body{
  font-family: var(--font-display);
  background: var(--glovo-bg);
  color: var(--glovo-ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; cursor:pointer; border:none; transition: all .18s ease; }
input, select{ font-family: inherit; }
::selection{ background: var(--glovo-yellow); color: #1C2321; }

/* ============ LOGIN SCREEN (Glovo Style) ============ */
#loginScreen{ min-height: 100vh; background: #FFFFFF; }
.login-split{ min-height: 100vh; display:flex; }
.login-hero-panel{
  flex: 1 1 46%; min-width: 360px;
  background: radial-gradient(circle at 10% 10%, #00B594, var(--glovo-green-deep));
  color: #FFFFFF;
  display:flex; flex-direction:column; justify-content:space-between;
  padding: 48px;
  position: relative; overflow:hidden;
}
.hero-brand{ display:flex; align-items:center; gap:12px; }
.hero-brand .login-mark{
  width:42px; height:42px; border-radius:12px;
  background: var(--glovo-yellow);
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
.login-mark{
  width: 38px; height: 38px; border-radius: 10px;
  display:flex; align-items:center; justify-content:center;
}
.login-mark svg{ width:22px; height:22px; stroke: #1C2321; }
.hero-brand span{ font-size:20px; font-weight:800; letter-spacing:-0.02em; color:#FFFFFF; }
.route-map{ flex:1; display:flex; align-items:center; justify-content:center; padding: 20px 0; }
.route-svg{ width: 100%; max-width: 340px; height: auto; }
.pin-label{ fill: #FFFFFF; font-family: var(--font-display); font-size: 13px; font-weight: 700; }
.pin-label-sub{ fill: rgba(255,255,255,0.7); font-family: var(--font-mono); font-size: 9.5px; }

.hero-foot{ font-family: var(--font-display); }
.hero-foot span{ font-size: 32px; font-weight: 800; color: var(--glovo-yellow); display:block; margin-bottom:4px; font-family: var(--font-mono); }
.hero-foot p{ font-size: 13px; color: rgba(255,255,255,0.85); max-width: 300px; line-height: 1.4; }

.login-form-panel{
  flex: 1 1 54%;
  background: #FFFFFF;
  display:flex; align-items:center; justify-content:center;
  padding: 40px 24px;
}
.login-card{ width: 100%; max-width: 440px; padding: 0; }
.login-brand{ margin-bottom: 28px; }
.login-brand h1{ font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--glovo-ink); }
.login-brand p{ font-size: 13.5px; color: var(--glovo-ink-soft); margin-top: 4px; font-weight: 500; }

@media (max-width: 860px){
  .login-split{ flex-direction: column; }
  .login-hero-panel{ min-width: 0; padding: 28px 24px; min-height: 0; }
  .route-map, .hero-foot p{ display:none; }
  .hero-foot span{ font-size: 20px; }
}

.profile-grid{
  display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  margin-bottom: 22px; max-height: 320px; overflow-y: auto; padding-right: 2px;
}
.profile-btn{
  background: var(--glovo-bg);
  border: 1.5px solid var(--glovo-line);
  border-radius: var(--radius);
  padding: 16px 8px;
  display:flex; flex-direction:column; align-items:center; gap: 8px;
}
.profile-btn:hover{ border-color: var(--glovo-green); background: #FFFFFF; transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.profile-btn.selected{ border-color: var(--glovo-green); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(0,160,130,0.18); }
.profile-avatar{
  width: 44px; height: 44px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size: 14px;
}
.profile-avatar svg{ width: 22px; height: 22px; }
.profile-btn span{ font-size: 13px; font-weight: 700; color: var(--glovo-ink); }
.profile-btn small{ font-size: 10.5px; color: var(--glovo-ink-soft); font-weight: 600; }

.login-input{
  width:100%; padding: 14px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--glovo-line); background: var(--glovo-bg);
  font-size: 14.5px; margin-bottom: 12px; color: var(--glovo-ink);
  transition: all .15s;
}
.login-input:focus{ outline:none; border-color: var(--glovo-green); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(0,160,130,0.15); }
.login-submit{
  width:100%; padding: 15px; border-radius: 28px;
  background: var(--glovo-yellow); color: #1C2321; font-weight: 800; font-size: 14.5px;
  letter-spacing: .01em; box-shadow: 0 6px 16px rgba(255, 194, 68, 0.35);
}
.login-submit:hover{ background: var(--glovo-yellow-hover); transform: translateY(-1px); }
.login-submit:disabled{ background: var(--glovo-line); color: var(--glovo-ink-soft); cursor:not-allowed; box-shadow:none; }
.login-error{ font-size: 13px; color: var(--red); text-align:center; margin-top: 12px; min-height: 18px; font-weight: 600; }

/* ============ AGENT PORTAL ============ */
#agentPortal, #nvAgentPortal{
  min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap: 16px; padding: 24px 16px; position: relative; background: var(--glovo-bg);
}
.portal-card{
  width:100%; max-width: 440px; background: #FFFFFF; border-radius: 24px; padding: 30px;
  box-shadow: var(--shadow-md); border: 1px solid var(--glovo-line);
}
.portal-btn{
  width:100%; padding: 16px; border-radius: 28px; background: var(--glovo-green); color:#fff;
  font-size: 15.5px; font-weight: 800; letter-spacing: .01em; box-shadow: 0 8px 20px rgba(0,160,130,0.28);
}
.portal-btn:hover{ background: var(--glovo-green-deep); transform: translateY(-1px); }
.portal-btn.is-checkedin{ background: var(--red); box-shadow: 0 8px 20px rgba(235,87,87,0.25); }

/* ============ SIDEBAR & NAVIGATION ============ */
.shell{ display:flex; min-height: 100vh; }
.sidebar{
  width: 240px; flex-shrink:0;
  background: #FFFFFF;
  border-right: 1.5px solid var(--glovo-line);
  color: var(--glovo-ink);
  display:flex; flex-direction:column;
  padding: 24px 16px;
}
.sidebar-brand{
  display:flex; align-items:center; gap: 10px;
  padding: 0 8px 24px; margin-bottom: 20px;
  border-bottom: 1.5px solid var(--glovo-line);
}
.sidebar-brand .mark{
  width:36px; height:36px; border-radius:10px;
  background: var(--glovo-yellow);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#1C2321; font-size:16px;
}
.sidebar-brand h2{ font-size: 17px; font-weight: 800; letter-spacing: -0.01em; color: var(--glovo-ink); }
.nav-group{ margin-bottom: 20px; }
.nav-label{
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--glovo-ink-soft); padding: 0 12px; margin-bottom: 8px; font-weight:700;
}
.nav-item{
  display:flex; align-items:center; gap: 12px;
  width:100%; text-align:left; padding: 11px 12px; border-radius: var(--radius-sm);
  color: var(--glovo-ink-soft); background: transparent; font-size: 14px; font-weight: 600;
}
.nav-item:hover{ background: var(--glovo-bg-subtle); color: var(--glovo-ink); }
.nav-item.active{
  background: var(--glovo-green-light);
  color: var(--glovo-green-deep);
  font-weight: 700;
}
.nav-item.active svg{ stroke: var(--glovo-green-deep); }
.nav-item svg{ width:18px; height:18px; flex-shrink:0; }

.main{ flex:1; overflow-x:auto; background: var(--glovo-bg); }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 20px 36px; border-bottom: 1.5px solid var(--glovo-line);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 5;
}
.topbar h1{ font-size: 20px; font-weight: 800; color: var(--glovo-ink); }

/* ============ CARDS & STATS ============ */
.card{ background: #FFFFFF; border: 1.5px solid var(--glovo-line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.stat-card{
  background: #FFFFFF; border: 1.5px solid var(--glovo-line); border-left: 5px solid var(--glovo-green);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-sm);
}
.stat-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card.accent-amber{ border-left-color: var(--glovo-yellow); }
.stat-card .value{ font-size: 30px; font-weight: 800; color: var(--glovo-ink); font-family: var(--font-mono); }

/* ============ BUTTONS & BADGES ============ */
.btn-primary{
  background: var(--glovo-yellow);
  color: #1C2321; font-weight: 700; font-size: 13.5px;
  padding: 10px 20px; border-radius: 24px; white-space: nowrap;
  box-shadow: 0 4px 12px rgba(255,194,68,0.3);
}
.btn-primary:hover{ background: var(--glovo-yellow-hover); transform: translateY(-1px); }
.btn-ghost{
  background: transparent; color: var(--glovo-ink-soft); font-weight: 600; font-size: 13px;
  padding: 9px 16px; border-radius: 20px;
}
.btn-ghost:hover{ background: var(--glovo-bg-subtle); color: var(--glovo-ink); }

.ptab.active{ background: var(--glovo-green); color: #FFFFFF; border-radius: 20px; }
.badge.fix{ background: var(--glovo-green-light); color: var(--glovo-green-deep); }
.badge.var{ background: var(--glovo-yellow-light); color: #B9800E; }
.shift-pill.s-jour{ background: var(--glovo-green); color: #FFFFFF; }
.shift-pill.s-nuit{ background: #374151; color: #FFFFFF; }
</style>
